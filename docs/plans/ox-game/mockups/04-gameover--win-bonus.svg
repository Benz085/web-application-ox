<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <title>04 Game over - win with streak bonus (+2), desktop</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="bonus" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16A34A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1E1B4B" flood-opacity="0.08"/>
    </filter>
  </defs>
  <style>
    text{font-family:system-ui,sans-serif;fill:#0F172A}
    .h2{font-size:22px;font-weight:800}
    .b{font-size:16px}
    .s{font-size:14px;fill:#475569}
    .xs{font-size:12px;fill:#64748B}
    .bd{font-weight:700}
    .sb{font-weight:600}
    .m{text-anchor:middle}
    .r{text-anchor:end}
    .w{fill:#FFFFFF}
    .a{fill:#4338CA}
    .ok{fill:#15803D}
    .big{font-size:44px;font-weight:800}
    .n{font-size:12px;fill:#64748B;font-style:italic}
  </style>
  <rect x="0" y="0" width="1440" height="900" fill="url(#bg)"/>

  <!-- Header (player, Play active) -->
  <rect x="0" y="0" width="1440" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="64.5" x2="1440" y2="64.5" stroke="#E2E8F0"/>
  <rect x="40" y="16" width="32" height="32" rx="9" fill="url(#brand)"/>
  <path d="M48 24 L56 32 M56 24 L48 32" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="61" cy="39" r="4" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="82" y="39" style="font-size:20px;font-weight:700">OX Game</text>
  <rect x="186" y="16" width="62" height="32" rx="16" fill="#EEF2FF"/>
  <text x="217" y="37" class="b bd m a">Play</text>
  <rect x="199" y="58" width="36" height="4" rx="2" fill="#4F46E5"/>
  <text x="314" y="37" class="b m" style="fill:#475569">Leaderboard</text>
  <circle cx="1196" cy="32" r="17" fill="url(#brand)" stroke="#E0E7FF" stroke-width="3"/>
  <text x="1196" y="36" class="xs m bd w">AM</text>
  <text x="1222" y="37" class="sb" style="font-size:14px">Alex Morgan</text>
  <rect x="1330" y="16" width="90" height="32" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="1375" y="37" class="s m sb" style="fill:#334155">Sign out</text>

  <text x="300" y="126" class="h2">Game over</text>
  <text x="300" y="152" class="s">You got three X in the middle row.</text>
  <rect x="580" y="112" width="140" height="28" rx="14" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="650" y="131" class="m sb" style="font-size:13px;fill:#047857">Difficulty: Easy</text>

  <!-- Board card -->
  <rect x="284" y="164" width="452" height="452" rx="26" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
  <g fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2">
    <rect x="300" y="180" width="132" height="132" rx="16"/>
    <rect x="444" y="180" width="132" height="132" rx="16"/>
    <rect x="588" y="180" width="132" height="132" rx="16"/>
    <rect x="300" y="468" width="132" height="132" rx="16"/>
    <rect x="444" y="468" width="132" height="132" rx="16"/>
    <rect x="588" y="468" width="132" height="132" rx="16"/>
  </g>
  <!-- Winning cells (player): GREEN frame -->
  <g fill="#F0FDF4" stroke="#16A34A" stroke-width="4">
    <rect x="302" y="326" width="128" height="128" rx="15"/>
    <rect x="446" y="326" width="128" height="128" rx="15"/>
    <rect x="590" y="326" width="128" height="128" rx="15"/>
  </g>
  <path d="M332 356 L400 424 M400 356 L332 424" stroke="#4F46E5" stroke-width="12" stroke-linecap="round"/>
  <path d="M476 356 L544 424 M544 356 L476 424" stroke="#4F46E5" stroke-width="12" stroke-linecap="round"/>
  <path d="M620 356 L688 424 M688 356 L620 424" stroke="#4F46E5" stroke-width="12" stroke-linecap="round"/>
  <circle cx="366" cy="246" r="38" fill="none" stroke="#EA580C" stroke-width="12"/>
  <circle cx="654" cy="534" r="38" fill="none" stroke="#EA580C" stroke-width="12"/>
  <line x1="316" y1="390" x2="704" y2="390" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
  <line x1="316" y1="390" x2="704" y2="390" stroke="#16A34A" stroke-width="10" stroke-linecap="round"/>

  <!-- Result card with bonus (green) -->
  <g transform="translate(800,110)">
    <rect width="340" height="180" rx="20" fill="#FFFFFF" stroke="#16A34A" stroke-width="2" filter="url(#sh)"/>
    <rect x="2" y="2" width="336" height="6" rx="3" fill="url(#bonus)"/>
    <circle cx="42" cy="38" r="18" fill="#DCFCE7"/>
    <path d="M42 27 L44.65 34.36 L52.46 34.6 L46.28 39.39 L48.47 46.9 L42 42.5 L35.53 46.9 L37.72 39.39 L31.54 34.6 L39.35 34.36 Z" fill="#16A34A"/>
    <text x="70" y="45" class="h2">3 wins in a row!</text>
    <rect x="262" y="22" width="56" height="34" rx="17" fill="#DCFCE7"/>
    <text x="290" y="46" class="m ok" style="font-size:22px;font-weight:800">+2</text>
    <text x="24" y="80" class="s">+1 for the win, +1 streak bonus.</text>
    <text x="24" y="102" class="s">Win streak starts again at 0/3.</text>
    <rect x="24" y="118" width="140" height="44" rx="12" fill="#4F46E5"/>
    <text x="94" y="145" class="b bd m w">Play again</text>
    <rect x="176" y="118" width="140" height="44" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="246" y="145" class="s m bd" style="fill:#1E293B">Change difficulty</text>
  </g>

  <g transform="translate(800,310)">
    <rect width="340" height="300" rx="20" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
    <text x="24" y="38" class="b bd">Your stats</text>
    <text x="24" y="74" class="s">Score</text>
    <text x="24" y="118" class="big" style="fill:#4338CA">8</text>
    <text x="24" y="150" class="s">Win streak</text>
    <circle cx="34" cy="172" r="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="62" cy="172" r="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="90" cy="172" r="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="110" y="161" width="44" height="22" rx="11" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="132" y="177" class="bd m" style="font-size:13px;fill:#334155">0/3</text>
    <text x="24" y="206" class="xs">Bonus earned. Win 3 in a row again for another +1.</text>
    <rect x="24" y="222" width="92" height="56" rx="12" fill="#F0FDF4"/>
    <text x="70" y="248" class="b bd m" style="fill:#15803D">9</text>
    <text x="70" y="268" class="xs m">Wins</text>
    <rect x="124" y="222" width="92" height="56" rx="12" fill="#FEF2F2"/>
    <text x="170" y="248" class="b bd m" style="fill:#B91C1C">2</text>
    <text x="170" y="268" class="xs m">Losses</text>
    <rect x="224" y="222" width="92" height="56" rx="12" fill="#F1F5F9"/>
    <text x="270" y="248" class="b bd m" style="fill:#334155">3</text>
    <text x="270" y="268" class="xs m">Draws</text>
  </g>

  <text x="300" y="650" class="n">Third win in a row (streak was 2/3, score 6 → 8). FR-7: bonus +1, total +2 for this game, then streak resets to 0/3.</text>
  <text x="300" y="670" class="n">Same GREEN win treatment as 04--win (green cell frames + green strike line); star icon instead of trophy marks the bonus.</text>
  <text x="300" y="690" class="n">The card breaks down the +2 in words so the bonus is clear without relying on colour. FR-6, FR-7, FR-8.</text>
</svg>
