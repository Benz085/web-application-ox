<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <title>06 Leaderboard - default, mobile</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1E1B4B" flood-opacity="0.08"/>
    </filter>
  </defs>
  <style>
    text{font-family:system-ui,sans-serif;fill:#0F172A}
    .h1{font-size:26px;font-weight:800}
    .b{font-size:14px}
    .s{font-size:14px;fill:#475569}
    .xs{font-size:12px;fill:#64748B}
    .bd{font-weight:700}
    .sb{font-weight:600}
    .m{text-anchor:middle}
    .r{text-anchor:end}
    .w{fill:#FFFFFF}
    .a{fill:#4338CA}
    .e{fill:#B91C1C}
    .n{font-size:11px;fill:#64748B;font-style:italic}
    .th{font-size:11px;font-weight:700;fill:#475569;letter-spacing:0.5px}
  </style>
  <rect x="0" y="0" width="375" height="812" fill="url(#bg)"/>

  <!-- Header (mobile, Leaderboard active) -->
  <rect x="0" y="0" width="375" height="100" fill="#FFFFFF"/>
  <rect x="16" y="14" width="28" height="28" rx="8" fill="url(#brand)"/>
  <path d="M23 21 L30 28 M30 21 L23 28" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="35" cy="33" r="3.5" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
  <text x="52" y="35" style="font-size:18px;font-weight:700">OX Game</text>
  <circle cx="250" cy="28" r="15" fill="url(#brand)" stroke="#E0E7FF" stroke-width="3"/>
  <text x="250" y="32" class="xs m bd w">AM</text>
  <rect x="275" y="12" width="84" height="32" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="317" y="33" class="s m sb" style="fill:#334155">Sign out</text>
  <line x1="0" y1="56.5" x2="375" y2="56.5" stroke="#F1F5F9"/>
  <text x="16" y="84" class="s">Play</text>
  <text x="76" y="84" class="s bd a">Leaderboard</text>
  <rect x="76" y="95" width="86" height="4" rx="2" fill="#4F46E5"/>
  <line x1="0" y1="100.5" x2="375" y2="100.5" stroke="#E2E8F0"/>

  <text x="16" y="140" class="h1">Leaderboard</text>
  <text x="16" y="164" class="s">All players ranked by score.</text>

  <!-- Table card -->
  <rect x="16" y="180" width="343" height="420" rx="18" fill="#FFFFFF" filter="url(#sh)"/>
  <rect x="16" y="180" width="343" height="36" rx="18" fill="#F8FAFC"/>
  <rect x="16" y="198" width="343" height="18" fill="#F8FAFC"/>
  <line x1="16" y1="216" x2="359" y2="216" stroke="#E2E8F0"/>
  <text x="33" y="203" class="th m">#</text>
  <text x="56" y="203" class="th">PLAYER</text>
  <text x="262" y="203" class="th r">SCORE</text>
  <text x="347" y="203" class="th r">W/L/D</text>

  <g fill="#F8FAFC">
    <rect x="17" y="264" width="341" height="48"/>
    <rect x="17" y="360" width="341" height="48"/>
    <rect x="17" y="456" width="341" height="48"/>
    <path d="M17 552 H358 V582 A17 17 0 0 1 341 599 H34 A17 17 0 0 1 17 582 Z"/>
  </g>

  <rect x="17" y="312" width="341" height="48" fill="#EEF2FF"/>
  <rect x="17" y="312" width="4" height="48" fill="#4F46E5"/>

  <!-- Rank badges -->
  <circle cx="33" cy="240" r="11" fill="#FDE68A" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="33" y="245" class="m bd" style="font-size:12px;fill:#78350F">1</text>
  <circle cx="33" cy="288" r="11" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="33" y="293" class="m bd" style="font-size:12px;fill:#1E293B">2</text>
  <circle cx="33" cy="336" r="11" fill="#FED7AA" stroke="#EA580C" stroke-width="1.5"/>
  <text x="33" y="341" class="m bd" style="font-size:12px;fill:#7C2D12">3</text>
  <text x="33" y="389" class="b bd m" style="fill:#475569">4</text>
  <text x="33" y="437" class="b bd m" style="fill:#475569">5</text>
  <text x="33" y="485" class="b bd m" style="fill:#475569">6</text>
  <text x="33" y="533" class="b bd m" style="fill:#475569">7</text>
  <text x="33" y="581" class="b bd m" style="fill:#475569">8</text>

  <text x="56" y="245" class="b sb">Ploy S.</text>
  <text x="262" y="245" class="b bd r">14</text>
  <text x="347" y="245" class="b r">18/4/2</text>

  <text x="56" y="293" class="b sb">Krit W.</text>
  <text x="262" y="293" class="b bd r">11</text>
  <text x="347" y="293" class="b r">15/4/6</text>

  <text x="56" y="341" class="b bd">Alex Morgan</text>
  <rect x="148" y="326" width="36" height="20" rx="10" fill="#4F46E5"/>
  <text x="166" y="340" class="m bd w" style="font-size:11px">You</text>
  <text x="262" y="341" class="b bd r">5</text>
  <text x="347" y="341" class="b bd r">7/2/3</text>

  <text x="56" y="389" class="b sb">Mina K.</text>
  <text x="262" y="389" class="b bd r">3</text>
  <text x="347" y="389" class="b r">6/3/1</text>

  <text x="56" y="437" class="b sb">Ton P.</text>
  <text x="262" y="437" class="b bd r">2</text>
  <text x="347" y="437" class="b r">5/3/4</text>

  <text x="56" y="485" class="b sb">Jane D.</text>
  <text x="262" y="485" class="b bd r">0</text>
  <text x="347" y="485" class="b r">2/2/5</text>

  <text x="56" y="533" class="b sb">Beam R.</text>
  <text x="262" y="533" class="b bd r e">−1</text>
  <text x="347" y="533" class="b r">1/2/0</text>

  <text x="56" y="581" class="b sb">Somsak T.</text>
  <text x="262" y="581" class="b bd r e">−3</text>
  <text x="347" y="581" class="b r">0/3/1</text>

  <rect x="16" y="180" width="343" height="420" rx="18" fill="none" stroke="#E2E8F0"/>
  <text x="16" y="628" class="xs">8 players</text>

  <text x="16" y="664" class="n">Mobile: no avatars; Wins/Losses/Draws merge into one</text>
  <text x="16" y="680" class="n">"W/L/D" column (header has abbr title "Wins / Losses / Draws").</text>
  <text x="16" y="696" class="n">Top 3 keep gold/silver/bronze badges with the number.</text>
  <text x="16" y="712" class="n">Long names are truncated with an ellipsis.</text>
</svg>
