<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <title>06 Leaderboard - empty, desktop</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1E1B4B" flood-opacity="0.08"/>
    </filter>
  </defs>
  <style>
    text{font-family:system-ui,sans-serif;fill:#0F172A}
    .h1{font-size:30px;font-weight:800}
    .h2{font-size:20px;font-weight:700}
    .b{font-size:16px}
    .s{font-size:14px;fill:#475569}
    .xs{font-size:12px;fill:#64748B}
    .bd{font-weight:700}
    .sb{font-weight:600}
    .m{text-anchor:middle}
    .r{text-anchor:end}
    .w{fill:#FFFFFF}
    .a{fill:#4338CA}
    .n{font-size:12px;fill:#64748B;font-style:italic}
    .th{font-size:12px;font-weight:700;fill:#475569;letter-spacing:0.5px}
  </style>
  <rect x="0" y="0" width="1440" height="900" fill="url(#bg)"/>

  <!-- Header (Leaderboard active) -->
  <rect x="0" y="0" width="1440" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="64.5" x2="1440" y2="64.5" stroke="#E2E8F0"/>
  <rect x="40" y="16" width="32" height="32" rx="9" fill="url(#brand)"/>
  <path d="M48 24 L56 32 M56 24 L48 32" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="61" cy="39" r="4" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="82" y="39" class="h2">OX Game</text>
  <text x="217" y="37" class="b m" style="fill:#475569">Play</text>
  <rect x="258" y="16" width="112" height="32" rx="16" fill="#EEF2FF"/>
  <text x="314" y="37" class="b bd m a">Leaderboard</text>
  <rect x="268" y="58" width="92" height="4" rx="2" fill="#4F46E5"/>
  <circle cx="1196" cy="32" r="17" fill="url(#brand)" stroke="#E0E7FF" stroke-width="3"/>
  <text x="1196" y="36" class="xs m bd w">AM</text>
  <text x="1222" y="37" class="sb" style="font-size:14px">Alex Morgan</text>
  <rect x="1330" y="16" width="90" height="32" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="1375" y="37" class="s m sb" style="fill:#334155">Sign out</text>

  <text x="240" y="130" class="h1">Leaderboard</text>
  <text x="240" y="158" class="s">All players ranked by score.</text>

  <rect x="240" y="184" width="960" height="300" rx="20" fill="#FFFFFF" filter="url(#sh)"/>
  <rect x="240" y="184" width="960" height="44" rx="20" fill="#F8FAFC"/>
  <rect x="240" y="208" width="960" height="20" fill="#F8FAFC"/>
  <line x1="240" y1="228" x2="1200" y2="228" stroke="#E2E8F0"/>
  <text x="264" y="212" class="th">RANK</text>
  <text x="340" y="212" class="th">PLAYER</text>
  <text x="860" y="212" class="th r">SCORE</text>
  <text x="960" y="212" class="th r">WINS</text>
  <text x="1060" y="212" class="th r">LOSSES</text>
  <text x="1170" y="212" class="th r">DRAWS</text>

  <!-- Friendly empty illustration: empty board + trophy placeholder -->
  <circle cx="720" cy="282" r="44" fill="#EEF2FF"/>
  <g stroke="#A5B4FC" stroke-width="3" stroke-linecap="round">
    <line x1="710" y1="256" x2="710" y2="308"/>
    <line x1="730" y1="256" x2="730" y2="308"/>
    <line x1="694" y1="272" x2="746" y2="272"/>
    <line x1="694" y1="292" x2="746" y2="292"/>
  </g>
  <path d="M697 258 L705 266 M705 258 L697 266" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
  <circle cx="740" cy="302" r="5" fill="none" stroke="#EA580C" stroke-width="3"/>
  <text x="720" y="356" class="h2 m">No players yet</text>
  <text x="720" y="382" class="s m">Scores show up here after a game is finished.</text>
  <rect x="636" y="404" width="168" height="48" rx="14" fill="#4F46E5" filter="url(#sh)"/>
  <text x="720" y="434" class="b bd m w">Play a game</text>

  <rect x="240" y="184" width="960" height="300" rx="20" fill="none" stroke="#E2E8F0"/>

  <text x="240" y="524" class="n">Shown when no player has finished a game yet (e.g. fresh database). Decided (AC-18): players with 0 finished games are hidden here,</text>
  <text x="240" y="544" class="n">so a new signed-in user can see this state before their first game ends. FR-9.</text>
</svg>
