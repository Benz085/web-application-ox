<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <title>09 Admin login (/login/admin) - error: invalid email or password</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>
  <style>
    text{font-family:system-ui,sans-serif;fill:#0F172A}
    .h1{font-size:28px;font-weight:800}
    .b{font-size:16px}
    .s{font-size:14px;fill:#475569}
    .xs{font-size:12px;fill:#64748B}
    .lb{font-size:14px;font-weight:600;fill:#0F172A}
    .bd{font-weight:700}
    .m{text-anchor:middle}
    .r{text-anchor:end}
    .w{fill:#FFFFFF}
    .a{fill:#4338CA}
    .e{fill:#B91C1C}
    .ph{font-size:15px;fill:#94A3B8}
    .n{font-size:12px;fill:#64748B;font-style:italic}
  </style>
  <rect x="0" y="0" width="1440" height="900" fill="url(#bg)"/>

  <rect x="520" y="140" width="400" height="630" rx="24" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>

  <rect x="688" y="176" width="64" height="64" rx="16" fill="#0F172A"/>
  <path d="M720 192 L735 198 V210 C735 220 729 226 720 229 C711 226 705 220 705 210 V198 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  <path d="M713 210 L718 215 L727 205" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="686" y="256" width="68" height="24" rx="12" fill="#0F172A"/>
  <text x="720" y="273" class="w m bd" style="font-size:12px;letter-spacing:1px">ADMIN</text>

  <text x="720" y="318" class="h1 m">Admin sign in</text>
  <text x="720" y="344" class="s m">For the OX Game administrator only.</text>

  <!-- Error alert (role="alert") -->
  <rect x="560" y="368" width="320" height="68" rx="14" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <rect x="560" y="368" width="6" height="68" rx="3" fill="#DC2626"/>
  <circle cx="590" cy="392" r="11" fill="#DC2626"/>
  <text x="590" y="397" class="w m bd" style="font-size:14px">!</text>
  <text x="610" y="397" class="e bd" style="font-size:15px">Sign-in failed</text>
  <text x="610" y="420" class="s">Invalid email or password.</text>

  <!-- Email kept; neutral border (do not reveal which field was wrong) -->
  <text x="560" y="466" class="lb">Email</text>
  <rect x="560" y="476" width="320" height="48" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="576" y="505" style="font-size:15px">you@example.com</text>

  <!-- Password cleared and focused -->
  <text x="560" y="552" class="lb">Password</text>
  <rect x="557" y="559" width="326" height="54" rx="14" fill="none" stroke="#C7D2FE" stroke-width="3"/>
  <rect x="560" y="562" width="320" height="48" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  <line x1="576" y1="576" x2="576" y2="596" stroke="#0F172A" stroke-width="1.5"/>
  <text x="584" y="591" class="ph">Password</text>
  <line x1="806" y1="570" x2="806" y2="602" stroke="#E2E8F0"/>
  <ellipse cx="822" cy="586" rx="9" ry="6" fill="none" stroke="#475569" stroke-width="1.8"/>
  <circle cx="822" cy="586" r="2.5" fill="#475569"/>
  <text x="866" y="591" class="a bd r" style="font-size:14px">Show</text>

  <!-- Button enabled again -->
  <rect x="560" y="638" width="320" height="52" rx="14" fill="#4F46E5" filter="url(#sh)"/>
  <text x="720" y="670" class="b bd m w">Sign in</text>


  <text x="520" y="800" class="n">AC-26: one generic message for unknown email, wrong password or bad email format. No red border on either field (would reveal which was wrong).</text>
  <text x="520" y="820" class="n">Alert = role="alert" + icon + heading, not colour only. Email is kept, password is cleared and focused. Alert clears on next submit.</text>
  <text x="520" y="840" class="n">Same alert box, other texts (plan): auth/too-many-requests → "Too many attempts. Try again later."; network/other → generic server error.</text>
  <text x="520" y="860" class="n">Same message for a valid account that is not the admin (client signs out first), so the page never reveals whether the password was right.</text>
</svg>
