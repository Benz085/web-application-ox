<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <title>07 Admin - not authorized (signed-in non-admin)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1E1B4B" flood-opacity="0.10"/>
    </filter>
  </defs>
  <style>
    text{font-family:system-ui,sans-serif;fill:#0F172A}
    .h1{font-size:30px;font-weight:800}
    .h2{font-size:20px;font-weight:700}
    .b{font-size:16px}
    .s{font-size:14px;fill:#475569}
    .xs{font-size:12px;fill:#64748B}
    .bd{font-weight:700}
    .sb{font-weight:600}
    .m{text-anchor:middle}
    .r{text-anchor:end}
    .w{fill:#FFFFFF}
    .a{fill:#4338CA}
    .n{font-size:12px;fill:#64748B;font-style:italic}
  </style>
  <rect x="0" y="0" width="1440" height="900" fill="url(#bg)"/>

  <!-- Header (player: no Admin link, nothing active) -->
  <rect x="0" y="0" width="1440" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="64.5" x2="1440" y2="64.5" stroke="#E2E8F0"/>
  <rect x="40" y="16" width="32" height="32" rx="9" fill="url(#brand)"/>
  <path d="M48 24 L56 32 M56 24 L48 32" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="61" cy="39" r="4" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="82" y="39" class="h2">OX Game</text>
  <text x="217" y="37" class="b m" style="fill:#475569">Play</text>
  <text x="314" y="37" class="b m" style="fill:#475569">Leaderboard</text>
  <circle cx="1196" cy="32" r="17" fill="#EDE9FE" stroke="#E0E7FF" stroke-width="3"/>
  <text x="1196" y="36" class="xs m bd" style="fill:#5B21B6">JD</text>
  <text x="1222" y="37" class="sb" style="font-size:14px">Jane D.</text>
  <rect x="1330" y="16" width="90" height="32" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="1375" y="37" class="s m sb" style="fill:#334155">Sign out</text>

  <rect x="470" y="200" width="500" height="320" rx="24" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
  <!-- Lock icon in soft amber circle -->
  <circle cx="720" cy="270" r="40" fill="#FEF3C7"/>
  <path d="M708 264 V252 A12 12 0 0 1 732 252 V264" fill="none" stroke="#B45309" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="700" y="264" width="40" height="30" rx="7" fill="#F59E0B"/>
  <circle cx="720" cy="277" r="3.5" fill="#FFFFFF"/>
  <path d="M720 280 V286" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <text x="720" y="350" class="h1 m">Not authorized</text>
  <text x="720" y="382" class="s m">You don't have permission to view this page.</text>
  <text x="720" y="404" class="s m">The admin page is only for approved accounts.</text>
  <rect x="628" y="432" width="184" height="48" rx="14" fill="#4F46E5" filter="url(#sh)"/>
  <text x="720" y="462" class="b bd m w">Back to Play</text>

  <text x="470" y="560" class="n">Shown when a signed-in non-admin opens /admin directly (the Admin link is hidden for them).</text>
  <text x="470" y="580" class="n">The server also rejects the admin data request (403), so no player data is ever sent. FR-10, NFR-1.</text>
  <text x="470" y="600" class="n">Signed-out users never see this page: they are sent to 01-login (FR-1). Friendly tone: amber lock, not a red error.</text>
</svg>
