<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <title>09 Admin login (/login/admin) - loading (signing in)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>
  <style>
    text{font-family:system-ui,sans-serif;fill:#0F172A}
    .h1{font-size:28px;font-weight:800}
    .b{font-size:16px}
    .s{font-size:14px;fill:#475569}
    .xs{font-size:12px;fill:#64748B}
    .lb{font-size:14px;font-weight:600;fill:#0F172A}
    .bd{font-weight:700}
    .m{text-anchor:middle}
    .r{text-anchor:end}
    .w{fill:#FFFFFF}
    .mu{fill:#64748B}
    .n{font-size:12px;fill:#64748B;font-style:italic}
  </style>
  <rect x="0" y="0" width="1440" height="900" fill="url(#bg)"/>

  <rect x="520" y="170" width="400" height="560" rx="24" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>

  <rect x="688" y="206" width="64" height="64" rx="16" fill="#0F172A"/>
  <path d="M720 222 L735 228 V240 C735 250 729 256 720 259 C711 256 705 250 705 240 V228 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  <path d="M713 240 L718 245 L727 235" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="686" y="286" width="68" height="24" rx="12" fill="#0F172A"/>
  <text x="720" y="303" class="w m bd" style="font-size:12px;letter-spacing:1px">ADMIN</text>

  <text x="720" y="348" class="h1 m">Admin sign in</text>
  <text x="720" y="374" class="s m">For the OX Game administrator only.</text>

  <!-- Fields read-only while request runs -->
  <text x="560" y="420" class="lb">Email</text>
  <rect x="560" y="430" width="320" height="48" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="576" y="459" class="b mu" style="font-size:15px">you@example.com</text>

  <text x="560" y="506" class="lb">Password</text>
  <rect x="560" y="516" width="320" height="48" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="576" y="546" class="mu" style="font-size:18px;letter-spacing:2px">••••••••••</text>
  <line x1="806" y1="524" x2="806" y2="556" stroke="#E2E8F0"/>
  <ellipse cx="822" cy="540" rx="9" ry="6" fill="none" stroke="#94A3B8" stroke-width="1.8"/>
  <circle cx="822" cy="540" r="2.5" fill="#94A3B8"/>
  <text x="866" y="545" class="bd r" style="font-size:14px;fill:#94A3B8">Show</text>

  <!-- Disabled button with spinner -->
  <rect x="560" y="592" width="320" height="52" rx="14" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="664" cy="618" r="10" fill="none" stroke="#C7D2FE" stroke-width="3"/>
  <path d="M664 608 A10 10 0 0 1 674 618" fill="none" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
  <text x="686" y="624" class="b bd mu">Signing in…</text>


  <text x="520" y="770" class="n">AC-26: Sign in button is disabled + aria-busy="true" while signInWithEmailAndPassword and GET /api/me run.</text>
  <text x="520" y="790" class="n">Inputs and the Show toggle are read-only/disabled during the request so the values cannot change mid-request.</text>
  <text x="520" y="810" class="n">Double submit (Enter twice) is ignored while busy. Disabled look matches 01-login--loading (slate-100, no shadow, muted text).</text>
</svg>
