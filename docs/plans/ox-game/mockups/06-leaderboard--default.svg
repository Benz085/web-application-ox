<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <title>06 Leaderboard - default, desktop</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1E1B4B" flood-opacity="0.08"/>
    </filter>
  </defs>
  <style>
    text{font-family:system-ui,sans-serif;fill:#0F172A}
    .h1{font-size:30px;font-weight:800}
    .h2{font-size:20px;font-weight:700}
    .b{font-size:16px}
    .s{font-size:14px;fill:#475569}
    .xs{font-size:12px;fill:#64748B}
    .bd{font-weight:700}
    .sb{font-weight:600}
    .m{text-anchor:middle}
    .r{text-anchor:end}
    .w{fill:#FFFFFF}
    .a{fill:#4338CA}
    .e{fill:#B91C1C}
    .n{font-size:12px;fill:#64748B;font-style:italic}
    .th{font-size:12px;font-weight:700;fill:#475569;letter-spacing:0.5px}
  </style>
  <rect x="0" y="0" width="1440" height="900" fill="url(#bg)"/>

  <!-- Header (Leaderboard active) -->
  <rect x="0" y="0" width="1440" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="64.5" x2="1440" y2="64.5" stroke="#E2E8F0"/>
  <rect x="40" y="16" width="32" height="32" rx="9" fill="url(#brand)"/>
  <path d="M48 24 L56 32 M56 24 L48 32" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="61" cy="39" r="4" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="82" y="39" class="h2">OX Game</text>
  <text x="217" y="37" class="b m" style="fill:#475569">Play</text>
  <rect x="258" y="16" width="112" height="32" rx="16" fill="#EEF2FF"/>
  <text x="314" y="37" class="b bd m a">Leaderboard</text>
  <rect x="268" y="58" width="92" height="4" rx="2" fill="#4F46E5"/>
  <circle cx="1196" cy="32" r="17" fill="url(#brand)" stroke="#E0E7FF" stroke-width="3"/>
  <text x="1196" y="36" class="xs m bd w">AM</text>
  <text x="1222" y="37" class="sb" style="font-size:14px">Alex Morgan</text>
  <rect x="1330" y="16" width="90" height="32" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="1375" y="37" class="s m sb" style="fill:#334155">Sign out</text>

  <text x="240" y="130" class="h1">Leaderboard</text>
  <text x="240" y="158" class="s">All players ranked by score.</text>

  <!-- Table card -->
  <rect x="240" y="184" width="960" height="460" rx="20" fill="#FFFFFF" filter="url(#sh)"/>
  <rect x="240" y="184" width="960" height="44" rx="20" fill="#F8FAFC"/>
  <rect x="240" y="208" width="960" height="20" fill="#F8FAFC"/>
  <line x1="240" y1="228" x2="1200" y2="228" stroke="#E2E8F0"/>
  <text x="264" y="212" class="th">RANK</text>
  <text x="340" y="212" class="th">PLAYER</text>
  <text x="860" y="212" class="th r">SCORE</text>
  <text x="960" y="212" class="th r">WINS</text>
  <text x="1060" y="212" class="th r">LOSSES</text>
  <text x="1170" y="212" class="th r">DRAWS</text>

  <!-- Zebra rows (2, 4, 6, 8) -->
  <g fill="#F8FAFC">
    <rect x="241" y="280" width="958" height="52"/>
    <rect x="241" y="384" width="958" height="52"/>
    <rect x="241" y="488" width="958" height="52"/>
    <path d="M241 592 H1199 V624 A19 19 0 0 1 1180 643 H260 A19 19 0 0 1 241 624 Z"/>
  </g>

  <!-- Current user highlight (row 3) -->
  <rect x="241" y="332" width="958" height="52" fill="#EEF2FF"/>
  <rect x="241" y="332" width="5" height="52" fill="#4F46E5"/>

  <!-- Rank badges: gold / silver / bronze keep the number -->
  <circle cx="276" cy="254" r="15" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>
  <text x="276" y="259" class="m bd" style="font-size:14px;fill:#78350F">1</text>
  <circle cx="276" cy="306" r="15" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <text x="276" y="311" class="m bd" style="font-size:14px;fill:#1E293B">2</text>
  <circle cx="276" cy="358" r="15" fill="#FED7AA" stroke="#EA580C" stroke-width="2"/>
  <text x="276" y="363" class="m bd" style="font-size:14px;fill:#7C2D12">3</text>
  <g class="m bd" style="font-size:15px">
    <text x="276" y="415" class="m bd" style="fill:#475569">4</text>
    <text x="276" y="467" class="m bd" style="fill:#475569">5</text>
    <text x="276" y="519" class="m bd" style="fill:#475569">6</text>
    <text x="276" y="571" class="m bd" style="fill:#475569">7</text>
    <text x="276" y="623" class="m bd" style="fill:#475569">8</text>
  </g>

  <!-- Avatars -->
  <circle cx="354" cy="254" r="15" fill="#FCE7F3"/>
  <text x="354" y="258" class="xs m bd" style="fill:#9D174D">PS</text>
  <circle cx="354" cy="306" r="15" fill="#DBEAFE"/>
  <text x="354" y="310" class="xs m bd" style="fill:#1E40AF">KW</text>
  <circle cx="354" cy="358" r="15" fill="url(#brand)"/>
  <text x="354" y="362" class="xs m bd w">AM</text>
  <circle cx="354" cy="410" r="15" fill="#DCFCE7"/>
  <text x="354" y="414" class="xs m bd" style="fill:#166534">MK</text>
  <circle cx="354" cy="462" r="15" fill="#FEF3C7"/>
  <text x="354" y="466" class="xs m bd" style="fill:#92400E">TP</text>
  <circle cx="354" cy="514" r="15" fill="#EDE9FE"/>
  <text x="354" y="518" class="xs m bd" style="fill:#5B21B6">JD</text>
  <circle cx="354" cy="566" r="15" fill="#CFFAFE"/>
  <text x="354" y="570" class="xs m bd" style="fill:#155E75">BR</text>
  <circle cx="354" cy="618" r="15" fill="#FFE4E6"/>
  <text x="354" y="622" class="xs m bd" style="fill:#9F1239">ST</text>

  <!-- Row 1 -->
  <text x="380" y="260" class="b sb">Ploy S.</text>
  <text x="860" y="260" class="b bd r">14</text>
  <text x="960" y="260" class="b r">18</text>
  <text x="1060" y="260" class="b r">4</text>
  <text x="1170" y="260" class="b r">2</text>
  <!-- Row 2 -->
  <text x="380" y="312" class="b sb">Krit W.</text>
  <text x="860" y="312" class="b bd r">11</text>
  <text x="960" y="312" class="b r">15</text>
  <text x="1060" y="312" class="b r">4</text>
  <text x="1170" y="312" class="b r">6</text>
  <!-- Row 3: current user -->
  <text x="380" y="364" class="b bd">Alex Morgan</text>
  <rect x="490" y="348" width="42" height="22" rx="11" fill="#4F46E5"/>
  <text x="511" y="363" class="xs m bd w">You</text>
  <text x="860" y="364" class="b bd r">5</text>
  <text x="960" y="364" class="b bd r">7</text>
  <text x="1060" y="364" class="b bd r">2</text>
  <text x="1170" y="364" class="b bd r">3</text>
  <!-- Row 4 -->
  <text x="380" y="416" class="b sb">Mina K.</text>
  <text x="860" y="416" class="b bd r">3</text>
  <text x="960" y="416" class="b r">6</text>
  <text x="1060" y="416" class="b r">3</text>
  <text x="1170" y="416" class="b r">1</text>
  <!-- Row 5 -->
  <text x="380" y="468" class="b sb">Ton P.</text>
  <text x="860" y="468" class="b bd r">2</text>
  <text x="960" y="468" class="b r">5</text>
  <text x="1060" y="468" class="b r">3</text>
  <text x="1170" y="468" class="b r">4</text>
  <!-- Row 6 -->
  <text x="380" y="520" class="b sb">Jane D.</text>
  <text x="860" y="520" class="b bd r">0</text>
  <text x="960" y="520" class="b r">2</text>
  <text x="1060" y="520" class="b r">2</text>
  <text x="1170" y="520" class="b r">5</text>
  <!-- Row 7 -->
  <text x="380" y="572" class="b sb">Beam R.</text>
  <text x="860" y="572" class="b bd r e">−1</text>
  <text x="960" y="572" class="b r">1</text>
  <text x="1060" y="572" class="b r">2</text>
  <text x="1170" y="572" class="b r">0</text>
  <!-- Row 8 -->
  <text x="380" y="624" class="b sb">Somsak T.</text>
  <text x="860" y="624" class="b bd r e">−3</text>
  <text x="960" y="624" class="b r">0</text>
  <text x="1060" y="624" class="b r">3</text>
  <text x="1170" y="624" class="b r">1</text>

  <rect x="240" y="184" width="960" height="460" rx="20" fill="none" stroke="#E2E8F0"/>
  <text x="240" y="672" class="xs">8 players</text>

  <text x="240" y="712" class="n">Semantic &lt;table&gt; with &lt;th scope="col"&gt;. Your row: bold text + "You" pill + left bar + aria-current="true" (not colour alone).</text>
  <text x="240" y="732" class="n">Top 3 rank badges: gold / silver / bronze circles that still show the number. Zebra rows on even rows. Negative scores: minus sign + red text.</text>
  <text x="240" y="752" class="n">Shows display name only (no email: Q4). Avatar = Google photo, coloured initials as fallback. Players with 0 finished games are hidden (AC-18). FR-9.</text>
</svg>
