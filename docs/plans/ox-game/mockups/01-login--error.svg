<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <title>01 Login - error (sign-in failed)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1E1B4B" flood-opacity="0.10"/>
    </filter>
  </defs>
  <style>
    text{font-family:system-ui,sans-serif;fill:#0F172A}
    .h1{font-size:32px;font-weight:800}
    .b{font-size:16px}
    .s{font-size:14px;fill:#475569}
    .xs{font-size:12px;fill:#64748B}
    .bd{font-weight:700}
    .m{text-anchor:middle}
    .w{fill:#FFFFFF}
    .e{fill:#B91C1C}
    .n{font-size:12px;fill:#64748B;font-style:italic}
  </style>
  <rect x="0" y="0" width="1440" height="900" fill="url(#bg)"/>

  <circle cx="300" cy="220" r="180" fill="#4F46E5" opacity="0.05"/>
  <circle cx="1180" cy="700" r="220" fill="#EA580C" opacity="0.05"/>
  <path d="M250 640 L310 700 M310 640 L250 700" stroke="#4F46E5" stroke-width="14" stroke-linecap="round" opacity="0.10"/>
  <circle cx="1150" cy="210" r="34" fill="none" stroke="#EA580C" stroke-width="14" opacity="0.12"/>

  <rect x="520" y="180" width="400" height="520" rx="24" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>

  <rect x="672" y="217" width="96" height="96" rx="22" fill="#EEF2FF"/>
  <g stroke="#C7D2FE" stroke-width="3" stroke-linecap="round">
    <line x1="707" y1="229" x2="707" y2="301"/>
    <line x1="733" y1="229" x2="733" y2="301"/>
    <line x1="684" y1="252" x2="756" y2="252"/>
    <line x1="684" y1="278" x2="756" y2="278"/>
  </g>
  <path d="M688 233 L700 245 M700 233 L688 245" stroke="#4F46E5" stroke-width="4" stroke-linecap="round"/>
  <circle cx="720" cy="265" r="7" fill="none" stroke="#EA580C" stroke-width="4"/>
  <path d="M740 285 L752 297 M752 285 L740 297" stroke="#4F46E5" stroke-width="4" stroke-linecap="round"/>

  <text x="720" y="358" class="h1 m">OX Game</text>
  <text x="720" y="388" class="s m">Play tic-tac-toe against a bot.</text>
  <text x="720" y="410" class="s m">Sign in to save your score and climb the leaderboard.</text>

  <!-- Error alert (role="alert") -->
  <rect x="560" y="438" width="320" height="76" rx="14" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <rect x="560" y="438" width="6" height="76" rx="3" fill="#DC2626"/>
  <circle cx="590" cy="464" r="11" fill="#DC2626"/>
  <text x="590" y="469" class="w m bd" style="font-size:14px">!</text>
  <text x="610" y="469" class="e bd" style="font-size:15px">Sign-in failed</text>
  <text x="610" y="494" class="s">Something went wrong. Please try again.</text>

  <!-- Button enabled again -->
  <rect x="560" y="536" width="320" height="52" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="598" cy="562" r="13" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="598" y="567" class="m bd" style="font-size:14px">G</text>
  <text x="730" y="568" class="b bd m">Sign in with Google</text>

  <text x="720" y="632" class="xs m">Only Google accounts are supported.</text>
  <text x="720" y="654" class="xs m">You need to sign in before you can play.</text>

  <text x="520" y="740" class="n">Alert uses role="alert", an icon and a heading, so the error is not shown by colour only.</text>
  <text x="520" y="760" class="n">If the user just closes the popup, the alert text is: "Sign-in was cancelled. Please try again."</text>
</svg>
