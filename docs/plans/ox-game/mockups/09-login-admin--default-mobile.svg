<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 800" width="360" height="800">
  <title>09 Admin login (/login/admin) - default, mobile 360px</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>
  <style>
    text{font-family:system-ui,sans-serif;fill:#0F172A}
    .h1{font-size:24px;font-weight:800}
    .b{font-size:16px}
    .s{font-size:14px;fill:#475569}
    .lb{font-size:14px;font-weight:600;fill:#0F172A}
    .bd{font-weight:700}
    .m{text-anchor:middle}
    .r{text-anchor:end}
    .w{fill:#FFFFFF}
    .a{fill:#4338CA}
    .ph{font-size:16px;fill:#94A3B8}
    .n{font-size:11px;fill:#64748B;font-style:italic}
  </style>
  <rect x="0" y="0" width="360" height="800" fill="url(#bg)"/>

  <rect x="16" y="72" width="328" height="560" rx="20" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>

  <rect x="152" y="104" width="56" height="56" rx="14" fill="#0F172A"/>
  <path d="M180 118 L193 123 V133 C193 142 188 147 180 150 C172 147 167 142 167 133 V123 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M174 133 L178 137 L186 128" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="146" y="176" width="68" height="24" rx="12" fill="#0F172A"/>
  <text x="180" y="193" class="w m bd" style="font-size:12px;letter-spacing:1px">ADMIN</text>

  <text x="180" y="236" class="h1 m">Admin sign in</text>
  <text x="180" y="262" class="s m">For the OX Game administrator only.</text>

  <text x="36" y="310" class="lb">Email</text>
  <rect x="36" y="320" width="288" height="48" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="52" y="350" class="ph">you@example.com</text>

  <text x="36" y="396" class="lb">Password</text>
  <rect x="36" y="406" width="288" height="48" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="52" y="436" class="ph">Password</text>
  <line x1="252" y1="414" x2="252" y2="446" stroke="#E2E8F0"/>
  <ellipse cx="268" cy="430" rx="9" ry="6" fill="none" stroke="#475569" stroke-width="1.8"/>
  <circle cx="268" cy="430" r="2.5" fill="#475569"/>
  <text x="312" y="435" class="a bd r" style="font-size:14px">Show</text>

  <rect x="36" y="482" width="288" height="52" rx="14" fill="#4F46E5" filter="url(#sh)"/>
  <text x="180" y="514" class="b bd m w">Sign in</text>


  <text x="16" y="672" class="n">Width 360px: card fills width with 16px margin, inputs and</text>
  <text x="16" y="688" class="n">button full width, touch targets ≥ 44px. Input font 16px so</text>
  <text x="16" y="704" class="n">iOS does not zoom on focus. Show toggle is its own 44px</text>
  <text x="16" y="720" class="n">button inside the field. Loading/error states use the same</text>
  <text x="16" y="736" class="n">layout as desktop (alert above Email, full width).</text>
</svg>
