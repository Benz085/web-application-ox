  <text x="120" y="672" class="xs">Times are shown in your local time zone. "—" means the player has signed in but not finished a game.</text>

  <text x="120" y="712" class="n">Each column header is a button inside &lt;th aria-sort&gt;. Active sort (Score, high to low): indigo pill + bold label + underline + single arrow, aria-sort="descending".</text>
  <text x="120" y="732" class="n">Click / Enter toggles descending ↔ ascending; other columns show a neutral up/down icon (hover: slate-100 pill). Default sort = Score high to low. FR-10.</text>
  <text x="120" y="752" class="n">Data comes from an admin-only API checked on the server (NFR-1). Admin link in the header is shown only for admin accounts. Header labels are uppercase via CSS.</text>
