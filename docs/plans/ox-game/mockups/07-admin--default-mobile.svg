<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <title>07 Admin - default, mobile (card list)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1E1B4B" flood-opacity="0.08"/>
    </filter>
  </defs>
  <style>
    text{font-family:system-ui,sans-serif;fill:#0F172A}
    .h1{font-size:24px;font-weight:800}
    .b{font-size:14px}
    .s{font-size:14px;fill:#475569}
    .xs{font-size:12px;fill:#64748B}
    .bd{font-weight:700}
    .sb{font-weight:600}
    .m{text-anchor:middle}
    .r{text-anchor:end}
    .w{fill:#FFFFFF}
    .a{fill:#4338CA}
    .v{font-size:17px;font-weight:800}
    .n{font-size:11px;fill:#64748B;font-style:italic}
  </style>
  <rect x="0" y="0" width="375" height="812" fill="url(#bg)"/>

  <!-- Header (mobile, Admin active) -->
  <rect x="0" y="0" width="375" height="100" fill="#FFFFFF"/>
  <rect x="16" y="14" width="28" height="28" rx="8" fill="url(#brand)"/>
  <path d="M23 21 L30 28 M30 21 L23 28" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="35" cy="33" r="3.5" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
  <text x="52" y="35" style="font-size:18px;font-weight:700">OX Game</text>
  <circle cx="250" cy="28" r="15" fill="url(#brand)" stroke="#E0E7FF" stroke-width="3"/>
  <text x="250" y="32" class="xs m bd w">AO</text>
  <rect x="275" y="12" width="84" height="32" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="317" y="33" class="s m sb" style="fill:#334155">Sign out</text>
  <line x1="0" y1="56.5" x2="375" y2="56.5" stroke="#F1F5F9"/>
  <text x="16" y="84" class="s">Leaderboard</text>
  <text x="116" y="84" class="s bd a">Admin</text>
  <rect x="116" y="95" width="44" height="4" rx="2" fill="#4F46E5"/>
  <line x1="0" y1="100.5" x2="375" y2="100.5" stroke="#E2E8F0"/>

  <text x="16" y="138" class="h1">Admin · Players</text>
  <text x="16" y="160" class="xs">Visible to admins only · 8 players</text>

  <!-- Sort control -->
  <text x="16" y="197" class="s sb">Sort by</text>
  <rect x="76" y="174" width="283" height="36" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="90" y="197" class="b sb">Score (high to low)</text>
  <path d="M333 189 L339 195 L345 189" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Card 1 -->
  <rect x="16" y="222" width="343" height="118" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
  <text x="32" y="248" class="b bd">ploy.s@gmail.com</text>
  <text x="32" y="272" class="xs">Score</text>
  <text x="120" y="272" class="xs">Streak</text>
  <text x="208" y="272" class="xs">W / L / D</text>
