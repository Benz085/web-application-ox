  <text x="208" y="296" class="v"><tspan style="fill:#15803D">18</tspan> / <tspan style="fill:#B91C1C">4</tspan> / <tspan style="fill:#334155">2</tspan></text>
  <text x="32" y="324" class="xs">Last played 2026-10-25 09:12</text>

