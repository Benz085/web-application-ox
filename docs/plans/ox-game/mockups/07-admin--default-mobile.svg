  <!-- Card 5 (cut off: page scrolls) -->
  <rect x="16" y="734" width="343" height="118" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
  <text x="32" y="760" class="b bd">ton.p@gmail.com</text>
  <text x="32" y="784" class="xs">Score</text>
  <text x="120" y="784" class="xs">Streak</text>
  <text x="208" y="784" class="xs">W / L / D</text>
  <text x="32" y="808" class="v" style="fill:#4338CA">2</text>
  <rect x="118" y="792" width="40" height="22" rx="11" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="138" y="807" class="m bd" style="font-size:12px;fill:#334155">0/3</text>
  <text x="208" y="808" class="v"><tspan style="fill:#15803D">5</tspan> / <tspan style="fill:#B91C1C">3</tspan> / <tspan style="fill:#334155">4</tspan></text>
