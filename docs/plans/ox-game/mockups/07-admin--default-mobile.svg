  <rect x="16" y="478" width="343" height="118" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
  <text x="32" y="504" class="b bd">alex.morgan@gmail.com</text>
  <text x="32" y="528" class="xs">Score</text>
  <text x="120" y="528" class="xs">Streak</text>
  <text x="208" y="528" class="xs">W / L / D</text>
  <text x="32" y="552" class="v" style="fill:#4338CA">5</text>
  <rect x="118" y="536" width="40" height="22" rx="11" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="138" y="551" class="m bd" style="font-size:12px;fill:#92400E">1/3</text>
  <text x="208" y="552" class="v"><tspan style="fill:#15803D">7</tspan> / <tspan style="fill:#B91C1C">2</tspan> / <tspan style="fill:#334155">3</tspan></text>
  <text x="32" y="580" class="xs">Last played 2026-10-25 10:05</text>

  <!-- Card 4 -->
  <rect x="16" y="606" width="343" height="118" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
  <text x="32" y="632" class="b bd">mina.k@gmail.com</text>
  <text x="32" y="656" class="xs">Score</text>
  <text x="120" y="656" class="xs">Streak</text>
  <text x="208" y="656" class="xs">W / L / D</text>
  <text x="32" y="680" class="v" style="fill:#4338CA">3</text>
  <rect x="118" y="664" width="40" height="22" rx="11" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="138" y="679" class="m bd" style="font-size:12px;fill:#92400E">1/3</text>
  <text x="208" y="680" class="v"><tspan style="fill:#15803D">6</tspan> / <tspan style="fill:#B91C1C">3</tspan> / <tspan style="fill:#334155">1</tspan></text>
