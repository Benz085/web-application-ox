<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <title>09 Admin login (/login/admin) - default</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>
  <style>
    text{font-family:system-ui,sans-serif;fill:#0F172A}
    .h1{font-size:28px;font-weight:800}
    .b{font-size:16px}
    .s{font-size:14px;fill:#475569}
    .xs{font-size:12px;fill:#64748B}
    .lb{font-size:14px;font-weight:600;fill:#0F172A}
    .bd{font-weight:700}
    .m{text-anchor:middle}
    .r{text-anchor:end}
    .w{fill:#FFFFFF}
    .a{fill:#4338CA}
    .ph{font-size:15px;fill:#94A3B8}
    .n{font-size:12px;fill:#64748B;font-style:italic}
  </style>
  <!-- Plain slate background: no X/O decoration, so it reads differently from the player login -->
  <rect x="0" y="0" width="1440" height="900" fill="url(#bg)"/>

  <!-- Card -->
  <rect x="520" y="170" width="400" height="560" rx="24" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>

  <!-- Admin mark: dark shield tile -->
  <rect x="688" y="206" width="64" height="64" rx="16" fill="#0F172A"/>
  <path d="M720 222 L735 228 V240 C735 250 729 256 720 259 C711 256 705 250 705 240 V228 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  <path d="M713 240 L718 245 L727 235" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Admin badge -->
  <rect x="686" y="286" width="68" height="24" rx="12" fill="#0F172A"/>
  <text x="720" y="303" class="w m bd" style="font-size:12px;letter-spacing:1px">ADMIN</text>

  <text x="720" y="348" class="h1 m">Admin sign in</text>
  <text x="720" y="374" class="s m">For the OX Game administrator only.</text>

  <!-- Email (autofocus: focus ring) -->
  <text x="560" y="420" class="lb">Email</text>
  <rect x="557" y="427" width="326" height="54" rx="14" fill="none" stroke="#C7D2FE" stroke-width="3"/>
  <rect x="560" y="430" width="320" height="48" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  <text x="576" y="459" class="ph">you@example.com</text>
  <line x1="576" y1="444" x2="576" y2="464" stroke="#0F172A" stroke-width="1.5"/>

  <!-- Password + show/hide toggle -->
  <text x="560" y="506" class="lb">Password</text>
  <rect x="560" y="516" width="320" height="48" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="576" y="545" class="ph">Password</text>
  <line x1="806" y1="524" x2="806" y2="556" stroke="#E2E8F0"/>
  <ellipse cx="822" cy="540" rx="9" ry="6" fill="none" stroke="#475569" stroke-width="1.8"/>
  <circle cx="822" cy="540" r="2.5" fill="#475569"/>
  <text x="866" y="545" class="a bd r" style="font-size:14px">Show</text>

  <!-- Primary button -->
  <rect x="560" y="592" width="320" height="52" rx="14" fill="#4F46E5" filter="url(#sh)"/>
  <text x="720" y="624" class="b bd m w">Sign in</text>


  <text x="520" y="770" class="n">FR-13 / UI-10: route /login/admin. Not linked from /login (AC-29). No Google button, no sign-up, no reset link.</text>
  <text x="520" y="790" class="n">Fields: &lt;label for&gt; + input type="email" autocomplete="username" / type="password" autocomplete="current-password", both required.</text>
  <text x="520" y="810" class="n">Show/Hide is a &lt;button type="button" aria-pressed&gt; with aria-label "Show password" / "Hide password"; when shown the text changes to "Hide".</text>
  <text x="520" y="830" class="n">Distinct from player login: slate background without X/O shapes, dark shield tile, "ADMIN" badge, heading "Admin sign in".</text>
  <text x="520" y="850" class="n">Success (AC-25): go to /admin. Signed-in admin opening /login/admin is redirected to /admin.</text>
</svg>
