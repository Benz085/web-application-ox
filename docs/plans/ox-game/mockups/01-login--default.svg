<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <title>01 Login - default (signed out)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1E1B4B" flood-opacity="0.10"/>
    </filter>
  </defs>
  <style>
    text{font-family:system-ui,sans-serif;fill:#0F172A}
    .h1{font-size:32px;font-weight:800}
    .h2{font-size:20px;font-weight:700}
    .b{font-size:16px}
    .s{font-size:14px;fill:#475569}
    .xs{font-size:12px;fill:#64748B}
    .bd{font-weight:700}
    .sb{font-weight:600}
    .m{text-anchor:middle}
    .r{text-anchor:end}
    .w{fill:#FFFFFF}
    .a{fill:#4338CA}
    .e{fill:#B91C1C}
    .n{font-size:12px;fill:#64748B;font-style:italic}
  </style>
  <rect x="0" y="0" width="1440" height="900" fill="url(#bg)"/>

  <!-- Decorative background shapes (aria-hidden) -->
  <circle cx="300" cy="220" r="180" fill="#4F46E5" opacity="0.05"/>
  <circle cx="1180" cy="700" r="220" fill="#EA580C" opacity="0.05"/>
  <path d="M250 640 L310 700 M310 640 L250 700" stroke="#4F46E5" stroke-width="14" stroke-linecap="round" opacity="0.10"/>
  <circle cx="1150" cy="210" r="34" fill="none" stroke="#EA580C" stroke-width="14" opacity="0.12"/>

  <!-- Card -->
  <rect x="520" y="200" width="400" height="440" rx="24" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>

  <!-- Logo: mini board tile -->
  <rect x="672" y="237" width="96" height="96" rx="22" fill="#EEF2FF"/>
  <g stroke="#C7D2FE" stroke-width="3" stroke-linecap="round">
    <line x1="707" y1="249" x2="707" y2="321"/>
    <line x1="733" y1="249" x2="733" y2="321"/>
    <line x1="684" y1="272" x2="756" y2="272"/>
    <line x1="684" y1="298" x2="756" y2="298"/>
  </g>
  <path d="M688 253 L700 265 M700 253 L688 265" stroke="#4F46E5" stroke-width="4" stroke-linecap="round"/>
  <circle cx="720" cy="285" r="7" fill="none" stroke="#EA580C" stroke-width="4"/>
  <path d="M740 305 L752 317 M752 305 L740 317" stroke="#4F46E5" stroke-width="4" stroke-linecap="round"/>

  <text x="720" y="378" class="h1 m">OX Game</text>
  <text x="720" y="408" class="s m">Play tic-tac-toe against a bot.</text>
  <text x="720" y="430" class="s m">Sign in to save your score and climb the leaderboard.</text>

  <!-- Google button -->
  <rect x="560" y="470" width="320" height="52" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="598" cy="496" r="13" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="598" y="501" class="m bd" style="font-size:14px">G</text>
  <text x="730" y="502" class="b bd m">Sign in with Google</text>

  <text x="720" y="572" class="xs m">Only Google accounts are supported.</text>
  <text x="720" y="594" class="xs m">You need to sign in before you can play.</text>

  <text x="520" y="690" class="n">FR-1: signed-out users see only this page. Any other URL (/play, /leaderboard, /admin) redirects here.</text>
  <text x="520" y="710" class="n">FR-2: button opens the Google sign-in popup (Firebase Auth). Session is kept after refresh.</text>
  <text x="520" y="730" class="n">Hover: border #A5B4FC + soft indigo bg #EEF2FF. Focus: 3px indigo focus ring offset 2px.</text>
</svg>
